<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fracta Lite</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      html, body { overscroll-behavior: none; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea, select { font-family: inherit; font-size: inherit; }
      [data-segni]::before {
        content: attr(data-segni);
        color: var(--segni);
        font-weight: 400;
      }
      @media (pointer: coarse) {
        * { -webkit-tap-highlight-color: transparent; }
        body { touch-action: manipulation; }
        body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        input, textarea, [contenteditable="true"], [contenteditable="true"] * {
          -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
        }
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 132, 138, .38);
        border-radius: 0;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background-color: rgba(128, 132, 138, .62); }
      #stampa { display: none; }
      @page { margin: 18mm 16mm; }
      @media print {
        html, body { height: auto !important; background: #fff !important; color: #000 !important; }
        #root { display: none !important; }
        #stampa { display: block; font-size: 12pt; line-height: 1.4; color: #000; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CMZXRSDo.js"></script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icona-192.png" />
    <link rel="apple-touch-icon" href="./icona-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fracta Lite" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      /* Il service worker tiene l'app per quando non c'è rete; persist()
         chiede al browser di non buttare i dati quando gli manca spazio.
         Nessuno dei due manda niente a nessuno. */
      if ("serviceWorker" in navigator) addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
